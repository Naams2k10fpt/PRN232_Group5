<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="quizms-brand-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#663af3" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Deep Midnight Base -->
  <rect width="512" height="512" rx="128" fill="#05060f"/>

  <!-- Frosted Glass Monogram Container -->
  <rect x="40" y="40" width="432" height="432" rx="100" fill="#161c28" stroke="#bad7f7" stroke-opacity="0.25" stroke-width="8"/>

  <!-- Geometric Q Ring -->
  <circle cx="256" cy="240" r="112" stroke="url(#quizms-brand-primary)" stroke-width="36" fill="none" stroke-linecap="round"/>

  <!-- Geometric Q Tail -->
  <path d="M304 288 L368 352" stroke="url(#quizms-brand-primary)" stroke-width="36" stroke-linecap="round"/>

  <!-- Inner Cyan Focus Dot -->
  <circle cx="256" cy="240" r="20" fill="#38bdf8"/>
</svg>
